<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Cadastro de Nomes</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/htmx/2.0.4/htmx.min.js"></script>
  <style>
    body { font-family: Arial, sans-serif; max-width: 600px; margin: 40px auto; padding: 0 16px; }
    h1 { text-align: center; }
    section { border: 1px solid #ccc; border-radius: 8px; padding: 16px; margin-bottom: 24px; }
    pre { background: #f4f4f4; padding: 12px; border-radius: 6px; min-height: 40px; white-space: pre-wrap; }
  </style>
</head>
<body>
  <h1>Cadastro de Nomes</h1>

  <section>
    <h2>Salvar um nome</h2>
    <form hx-post="https://ola-tp1.onrender.com/nomes"
          hx-ext="json-enc"
          hx-target="#resposta-salvar"
          hx-on::after-request="this.reset()">
      <input type="text" name="nome" placeholder="Digite um nome" required>
      <button type="submit">Salvar</button>
    </form>
    <h3>Resposta do servidor:</h3>
    <pre id="resposta-salvar"></pre>
  </section>

  <section>
    <h2>Listar nomes cadastrados</h2>
    <button hx-get="https://ola-tp1.onrender.com/nomes" hx-target="#resposta-lista">
      Listar nomes
    </button>
    <h3>Resposta do servidor:</h3>
    <pre id="resposta-lista"></pre>
  </section>

  <script>
   
    htmx.config.selfRequestsOnly = false;

    htmx.defineExtension("json-enc", {
      onEvent: function (name, evt) {
        if (name === "htmx:configRequest") {
          evt.detail.headers["Content-Type"] = "application/json";
        }
      },
      encodeParameters: function (xhr, parameters) {
        return JSON.stringify(parameters);
      }
    });
  </script>
</body>
</html>
